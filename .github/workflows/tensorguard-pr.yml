name: TensorGuard PR annotations

# Dogfoods the composite action in action.yml: on every pull request, verify the
# example models and annotate any shape/device/dtype/phase/gradient bug directly
# on the offending line of the diff. Annotate-only here so the examples (which
# intentionally include buggy models) don't block the repo's own PRs.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run TensorGuard
        uses: ./
        with:
          paths: examples
          soundness-mode: balanced
          fail-on: never
