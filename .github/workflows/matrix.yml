name: Compatibility matrix
on:
  push:
  pull_request:
  schedule:
    # Weekly run to catch upstream torch/Python regressions.
    - cron: "0 6 * * 1"

jobs:
  # Step 83 — multi-OS, multi-Python, multi-torch compatibility matrix.
  # The (python, torch) pairings below are curated to be mutually compatible;
  # see tests/test_ci_matrix.py which pins this file against a compatibility
  # table so an impossible combination can never silently merge.
  matrix:
    name: py${{ matrix.python-version }} torch${{ matrix.torch-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — full Python sweep against a stable torch.
          - os: ubuntu-latest
            python-version: "3.9"
            torch-version: "2.2.2"
          - os: ubuntu-latest
            python-version: "3.10"
            torch-version: "2.4.1"
          - os: ubuntu-latest
            python-version: "3.11"
            torch-version: "2.6.0"
          - os: ubuntu-latest
            python-version: "3.12"
            torch-version: "2.6.0"
          - os: ubuntu-latest
            python-version: "3.13"
            torch-version: "2.6.0"
          # macOS — exercise the Apple-silicon runner on two torch lines.
          - os: macos-latest
            python-version: "3.11"
            torch-version: "2.4.1"
          - os: macos-latest
            python-version: "3.12"
            torch-version: "2.6.0"
          # Windows — verify the analyzer and CLI on a non-POSIX path layout.
          - os: windows-latest
            python-version: "3.11"
            torch-version: "2.6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned torch + TensorGuard
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ matrix.torch-version }}" --index-url https://download.pytorch.org/whl/cpu || pip install "torch==${{ matrix.torch-version }}"
          pip install -e ".[dev]" z3-solver
      - name: Report resolved versions
        run: python -c "import sys, torch; print('python', sys.version.split()[0]); print('torch', torch.__version__)"
      - name: Run the supported-surface test suite
        run: >-
          python -m pytest
          tests/test_api_stability.py
          tests/test_typing.py
          tests/test_security.py
          tests/test_reporters.py
          tests/test_baseline.py
          tests/test_deprecation.py
          tests/test_torch_integration.py
          tests/test_framework_hooks.py
          --timeout=600 -q

  nightly-torch:
    # Early-warning job against torch nightly; allowed to fail so an upstream
    # break does not block merges but is visible on the dashboard.
    name: torch-nightly (early warning)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch nightly + TensorGuard
        run: |
          python -m pip install --upgrade pip
          pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          pip install -e ".[dev]" z3-solver
      - name: Report resolved versions
        run: python -c "import torch; print('torch nightly', torch.__version__)"
      - name: Run the supported-surface test suite
        run: >-
          python -m pytest
          tests/test_security.py
          tests/test_reporters.py
          tests/test_torch_integration.py
          --timeout=600 -q
