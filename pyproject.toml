[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorguard"
version = "0.1.0"
description = "Guard-harvesting constraint verification for PyTorch nn.Module — catches shape mismatches, broadcast bugs, device inconsistencies, and phase-dependent errors before training starts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "TensorGuard Authors" },
]
keywords = ["pytorch", "static-analysis", "shape-checking", "smt", "verification", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "z3-solver>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "pytest-cov", "coverage"]

[project.urls]
Homepage = "https://github.com/thehalleyyoung/tensorguard"
Repository = "https://github.com/thehalleyyoung/tensorguard"
Issues = "https://github.com/thehalleyyoung/tensorguard/issues"
Changelog = "https://github.com/thehalleyyoung/tensorguard/blob/main/CHANGELOG.md"

[project.scripts]
tensorguard = "src.cli.main:main"
tensorguard-precommit = "src.precommit:main"

[project.entry-points.pytest11]
tensorguard = "src.pytest_tensorguard"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
src = ["py.typed", "*.pyi"]
tensorguard = ["py.typed"]

[tool.setuptools.packages.find]
include = ["src*", "tensorguard*"]

# Step 82 — enforceable coverage gate. The gate is scoped to the public API and
# the Phase 7/8 integration modules (the supported surface), which are held to a
# >90% line-coverage threshold. See reproducibility/coverage_gate.py and
# .github/workflows/coverage.yml.
[tool.coverage.run]
branch = true
source = [
    "src/safe_loader.py",
    "src/reporters.py",
    "src/baseline.py",
    "src/deprecation.py",
    "src/torch_integration.py",
    "src/framework_hooks.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end checks that spawn a subprocess (e.g. the coverage gate)",
]
