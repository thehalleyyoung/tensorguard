# Step 68 — tox integration.
#
# `tox` runs the suite across Python versions and exposes a `tensorguard`
# environment that runs TensorGuard's own static verification over the examples.
# Run `tox -l` to list environments.

[tox]
envlist = py39, py310, py311, py312
isolated_build = True

[testenv]
deps =
    pytest
    pytest-timeout
    z3-solver
commands =
    pytest tests/ -q --timeout=300 {posargs}

[testenv:tensorguard]
description = Verify the example models with TensorGuard (annotate-only).
deps =
    z3-solver
setenv =
    INPUT_PATHS = examples
    INPUT_FAIL_ON = never
commands =
    python -m src.github_action

[testenv:lint]
description = Type-check the package.
deps =
    mypy
commands =
    mypy src
